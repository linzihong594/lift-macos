name: 功能建议 / Feature request
description: 提出具体的使用场景和改进 / Suggest a use case or improvement
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景 / Use case
      description: 你遇到了什么问题？ / What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为 / Proposed behavior
    validations:
      required: true
